<!DOCTYPE html>                                                                                                                                                                                                     
<html>                                                                                                                                                                                                              
<head>                                                                                                                                                                                                              
   <title>Concurrency Limiter Live Demo</title>                                                                                                                                                                    
   <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>                                                                                                                                                   
   <style>                                                                                                                                                                                                         
      body { font-family: -apple-system, sans-serif; padding: 2rem; background: #f4f4f5; }                                                                                                                        
      .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }                                                                                                
      .controls { margin-top: 1rem; display: flex; gap: 1rem; }                                                                                                                                                   
      button { padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; }                                                                                        
      .btn-spike { background: #ef4444; }                                                                                                                                                                         
      .btn-recover { background: #22c55e; }                                                                                                                                                                       
   </style>                                                                                                                                                                                                        
</head>                                                                                                                                                                                                             
<body>                                                                                                                                                                                                              
   <div class="card">                                                                                                                                                                                              
      <h2>Gradient2 Limiter Live View</h2>                                                                                                                                                                        
      <canvas id="chart" height="100"></canvas>                                                                                                                                                                   
      <div class="controls">                                                                                                                                                                                      
            <button class="btn-spike" onclick="fetch('/admin/spike', {method: 'POST'})">Inject Latency Spike</button>                                                                                               
            <button class="btn-recover" onclick="fetch('/admin/recover', {method: 'POST'})">Recover Latency</button>                                                                                                
      </div>                                                                                                                                                                                                      
   </div>                                                                                                                                                                                                          
                                                                                                                                                                                                                  
   <script>                                                                                                                                                                                                        
      const ctx = document.getElementById('chart').getContext('2d');                                                                                                                                              
      const chart = new Chart(ctx, {                                                                                                                                                                              
            type: 'line',                                                                                                                                                                                           
            data: { labels: [], datasets: [                                                                                                                                                                         
               { label: 'Limit', borderColor: '#3b82f6', data: [], tension: 0.4 },                                                                                                                                 
               { label: 'In Flight', borderColor: '#10b981', data: [], tension: 0.4 }                                                                                                                              
            ]},                                                                                                                                                                                                     
            options: { animation: false, scales: { y: { beginAtZero: true, max: 150 } } }                                                                                                                           
      });                                                                                                                                                                                                         
                                                                                                                                                                                                                  
      const evtSource = new EventSource("/metrics/stream");                                                                                                                                                       
      evtSource.onmessage = function(event) {                                                                                                                                                                     
            const data = JSON.parse(event.data);                                                                                                                                                                    
            const time = new Date(data.t).toLocaleTimeString();                                                                                                                                                     
                                                                                                                                                                                                                  
            if (chart.data.labels.length > 50) {                                                                                                                                                                    
               chart.data.labels.shift();                                                                                                                                                                          
               chart.data.datasets[0].data.shift();                                                                                                                                                                
               chart.data.datasets[1].data.shift();                                                                                                                                                                
            }                                                                                                                                                                                                       
                                                                                                                                                                                                                  
            chart.data.labels.push(time);                                                                                                                                                                           
            chart.data.datasets[0].data.push(data.limit);                                                                                                                                                           
            chart.data.datasets[1].data.push(data.inFlight);
            chart.update();
      };
   </script>
</body>
</html>
